name: Verify FullSensorRecord contribution

on:
  push:
    branches:
      - ci/full-sensor-record-verification-20261010

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b886a12c5a6cbf649a82b90e5438f10d2e9e064f
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify the exact contribution revision
        run: |
          test "$(git rev-parse HEAD)" = b886a12c5a6cbf649a82b90e5438f10d2e9e064f
          test "$(git hash-object src/test/java/org/metricshub/ipmi/core/coding/commands/sdr/record/FullSensorRecordTest.java)" = 4505337d3bb356eb1d6fdbf8e5b1aa147fdc7932
          git diff --exit-code
          git diff --check HEAD^ HEAD
      - name: Run the focused sensor tests
        run: mvn --batch-mode -Dtest=FullSensorRecordTest test
      - name: Run the full build and configured quality gates
        run: mvn --batch-mode clean verify site
      - name: Verify clean source and export result counts
        run: |
          git diff --exit-code
          python3 - <<'PY'
          import json, pathlib, subprocess
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path("target/surefire-reports").glob("TEST-*.xml"))
          assert reports, "No Surefire XML reports"
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              root = ET.parse(report).getroot()
              for name in totals:
                  totals[name] += int(root.attrib.get(name, 0))
          focused = ET.parse("target/surefire-reports/TEST-org.metricshub.ipmi.core.coding.commands.sdr.record.FullSensorRecordTest.xml").getroot()
          assert int(focused.attrib["tests"]) == 14, focused.attrib
          assert totals == {"tests": 171, "failures": 0, "errors": 0, "skipped": 0}, totals
          source = pathlib.Path("src/test/java/org/metricshub/ipmi/core/coding/commands/sdr/record/FullSensorRecordTest.java")
          required = ["checkstyle-result.xml", "pmd.xml", "cpd.xml", "spotbugsXml.xml"]
          assert all(pathlib.Path("target", name).is_file() for name in required), required
          result = {
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "test_blob_sha": subprocess.check_output(["git", "hash-object", str(source)], text=True).strip(),
              "focused_tests": 14, "full_suite": totals, "report_files": required,
              "commands": ["mvn --batch-mode -Dtest=FullSensorRecordTest test", "mvn --batch-mode clean verify site"],
              "source_unchanged": True
          }
          assert result["checked_out_sha"] == "b886a12c5a6cbf649a82b90e5438f10d2e9e064f", result
          assert result["test_blob_sha"] == "4505337d3bb356eb1d6fdbf8e5b1aa147fdc7932", result
          print("JAIPILOT_VERIFICATION_RESULT=" + json.dumps(result, sort_keys=True))
          PY
