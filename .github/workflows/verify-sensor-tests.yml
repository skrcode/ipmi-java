name: Verify FullSensorRecord contribution

on:
  push:
    branches:
      - ci/full-sensor-record-verification-20261010

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a6e23a3330302f6577b2dfbbe8695445b1353734
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply the bounded test patch
        env:
          TEST_PATCH_BASE64: ''
        run: |
          test "$(git rev-parse HEAD)" = a6e23a3330302f6577b2dfbbe8695445b1353734
          git diff --exit-code
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "sensor-tests.patch").write_bytes(base64.b64decode(os.environ["TEST_PATCH_BASE64"], validate=True))
          PY
          git apply --check "$RUNNER_TEMP/sensor-tests.patch"
          git apply "$RUNNER_TEMP/sensor-tests.patch"
      - name: Run the repository formatter
        run: mvn --batch-mode formatter:format
      - name: Verify the exact change scope
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert paths == ["src/test/java/org/metricshub/ipmi/core/coding/commands/sdr/record/FullSensorRecordTest.java"], paths
          PY
          git diff --check
      - name: Run the focused sensor tests
        run: mvn --batch-mode -Dtest=FullSensorRecordTest test
      - name: Run the full build and configured quality gates
        run: mvn --batch-mode clean verify site
      - name: Export verified test source and result counts
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path("target/surefire-reports").glob("TEST-*.xml"))
          assert reports, "No Surefire XML reports"
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              root = ET.parse(report).getroot()
              for name in totals:
                  totals[name] += int(root.attrib.get(name, 0))
          focused = ET.parse("target/surefire-reports/TEST-org.metricshub.ipmi.core.coding.commands.sdr.record.FullSensorRecordTest.xml").getroot()
          assert int(focused.attrib["tests"]) == 14, focused.attrib
          assert totals["failures"] == totals["errors"] == totals["skipped"] == 0, totals
          source = pathlib.Path("src/test/java/org/metricshub/ipmi/core/coding/commands/sdr/record/FullSensorRecordTest.java")
          required = ["checkstyle-result.xml", "pmd.xml", "cpd.xml", "spotbugsXml.xml"]
          assert all(pathlib.Path("target", name).is_file() for name in required), required
          result = {
              "checked_out_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "test_blob_sha": subprocess.check_output(["git", "hash-object", str(source)], text=True).strip(),
              "focused_tests": 14, "full_suite": totals, "report_files": required,
              "commands": ["mvn --batch-mode formatter:format", "mvn --batch-mode -Dtest=FullSensorRecordTest test", "mvn --batch-mode clean verify site"]
          }
          print("JAIPILOT_VERIFICATION_RESULT=" + json.dumps(result, sort_keys=True))
          print("JAIPILOT_FORMATTED_TEST_BASE64=" + base64.b64encode(source.read_bytes()).decode())
          PY
